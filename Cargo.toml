[package]
name = "raft-kv"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bincode = "1"
prometheus = "0.13"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
