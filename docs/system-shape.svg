<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Raft cluster request and replication flow</title>
  <desc id="desc">A client sends a request to any node, the leader replicates it to followers, and a majority commit applies it to the key-value state machine.</desc>
  <defs>
    <marker id="request-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d29922"/>
    </marker>
    <marker id="commit-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3fb950"/>
    </marker>
    <style>
      .canvas { fill: #0f1115; }
      .frame { fill: #11161d; stroke: #30363d; }
      .node { fill: #171a21; stroke: #30363d; }
      .leader { fill: #1d211b; stroke: #d29922; }
      .state { fill: #171a21; stroke: #3fb950; }
      .title { fill: #e6e1d9; font: 700 22px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; }
      .subtitle { fill: #8b949e; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .label { fill: #e6e1d9; font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .detail { fill: #8b949e; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .number { fill: #0f1115; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
      .request { fill: none; stroke: #d29922; stroke-width: 2.5; marker-end: url(#request-arrow); }
      .commit { fill: none; stroke: #3fb950; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#commit-arrow); }
    </style>
  </defs>

  <rect class="canvas" width="960" height="470" rx="18"/>
  <rect class="frame" x="18" y="18" width="924" height="434" rx="14"/>
  <text class="title" x="36" y="52">RAFT REQUEST AND REPLICATION</text>
  <text class="subtitle" x="36" y="78">client routing, leader replication, majority commit</text>

  <!-- Request path. Each arrow has a clear lane between nodes. -->
  <path class="request" d="M180 150 H246"/>
  <path class="request" d="M488 150 H548"/>

  <!-- Replication paths use a left-side bus, so no line passes behind a node. -->
  <path class="request" d="M620 206 V244 H520 V296 H548"/>
  <path class="request" d="M680 206 V258 H500 V358 H548"/>
  <path class="commit" d="M720 206 V276 H480 V410 H548"/>

  <g>
    <rect class="node" x="56" y="116" width="124" height="72" rx="14"/>
    <circle cx="80" cy="140" r="14" fill="#8b949e"/>
    <text class="number" x="80" y="145">01</text>
    <text class="label" x="72" y="169">client</text>
    <text class="detail" x="72" y="214">request</text>
  </g>

  <g>
    <rect class="node" x="246" y="116" width="242" height="72" rx="14"/>
    <circle cx="270" cy="140" r="14" fill="#8b949e"/>
    <text class="number" x="270" y="145">02</text>
    <text class="label" x="262" y="169">any node</text>
    <text class="detail" x="262" y="214">accept or return leader hint</text>
  </g>

  <g>
    <rect class="leader" x="548" y="116" width="178" height="90" rx="14"/>
    <circle cx="574" cy="142" r="14" fill="#d29922"/>
    <text class="number" x="574" y="147">03</text>
    <text class="label" x="566" y="173">leader</text>
    <text class="detail" x="566" y="194">append and replicate</text>
  </g>

  <g>
    <rect class="node" x="548" y="270" width="178" height="52" rx="14"/>
    <text class="label" x="572" y="302">follower 1</text>
  </g>
  <g>
    <rect class="node" x="548" y="332" width="178" height="52" rx="14"/>
    <text class="label" x="572" y="364">followers 2-4</text>
  </g>
  <g>
    <rect class="state" x="548" y="394" width="242" height="32" rx="16"/>
    <text class="detail" x="568" y="415" fill="#3fb950">majority commit to KV state</text>
  </g>

  <text class="subtitle" x="780" y="142">solid: request path</text>
  <text class="subtitle" x="780" y="166">dashed: commit path</text>
</svg>
